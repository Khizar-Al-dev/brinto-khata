name: Build APK Verse APK

on:
  push:
    paths:
      - apkverse-installer.zip
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o apkverse-installer.zip -d apkverse-installer
          ls apkverse-installer
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          GRADLE_BIN=$(echo /tmp/gradle-*/bin/gradle)
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version
      - name: Set Gradle memory
        run: |
          P=apkverse-installer
          touch "$P/gradle.properties"
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.daemon=/d; /^org.gradle.parallel=/d; /^android.useAndroidX=/d' "$P/gradle.properties"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\nandroid.useAndroidX=true\n' >> "$P/gradle.properties"
      - name: Build debug APK
        run: |
          cd apkverse-installer
          "$GRADLE_BIN" :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apkverse-debug-apk
          path: apkverse-installer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
