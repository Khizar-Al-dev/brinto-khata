name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o brinto-khata-android-local.zip
          ls brinto-khata-android-local

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle from wrapper properties
        run: |
          cd brinto-khata-android-local
          DIST_URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\r' | sed 's/\:/:/g')
          echo "Gradle distribution: $DIST_URL"
          curl -sL "$DIST_URL" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          GRADLE_BIN=$(echo /tmp/gradle-*/bin/gradle)
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version

      - name: Build debug APK
        run: |
          cd brinto-khata-android-local
          "$GRADLE_BIN" assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brinto-khata-debug-apk
          path: brinto-khata-android-local/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
