name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o brinto-khata-android.zip -d brinto-khata-android
          ls brinto-khata-android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          GRADLE_BIN=$(echo /tmp/gradle-*/bin/gradle)
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version
      - name: Patch Compose Compiler plugin
        run: |
          P=brinto-khata-android
          echo "--- project files ---"
          find "$P" -type f | sort
          echo "--- settings.gradle.kts ---"
          cat "$P/settings.gradle.kts"
          echo "--- app/build.gradle.kts ---"
          cat "$P/app/build.gradle.kts"
          python3 - <<'PYEOF'
          from pathlib import Path
          proj = Path("brinto-khata-android")
          app_path = proj / "app/build.gradle.kts"
          settings_path = proj / "settings.gradle.kts"
          app = app_path.read_text()
          settings = settings_path.read_text()
          kotlin_version = None
          for text in (app, settings):
              for line in text.splitlines():
                  s = line.strip()
                  if "org.jetbrains.kotlin.android" in s and "version" in s and '"' in s:
                      kotlin_version = s.split('"')[1]
                      break
              if kotlin_version:
                  break
          if kotlin_version is None:
              kotlin_version = "2.0.21"
          print("Kotlin version:", kotlin_version)
          if "kotlin.plugin.compose" in app:
              print("app already has compose compiler plugin")
          else:
              plugins = "plugins {"
              marker = app.find(plugins)
              insert = f'\n    id("org.jetbrains.kotlin.plugin.compose") version "{kotlin_version}"'
              app = app[: marker + len(plugins)] + insert + app[marker + len(plugins):]
              app_path.write_text(app)
              print("added compose compiler plugin")
          PYEOF
      - name: Patch ImageUtils imports
        run: |
          P=brinto-khata-android
          grep -rl "androidx.compose.ui.graphics.ImageBitmap" "$P" --include="*.kt" || true
          grep -rl "asImageBitmap" "$P" --include="*.kt" || true
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          proj = Path("brinto-khata-android")
          for f in proj.rglob("*.kt"):
              t = f.read_text()
              orig = t
              t = t.replace("import androidx.compose.ui.graphics.ImageBitmap", "import android.graphics.Bitmap")
              t = re.sub(r"\bImageBitmap\b", "Bitmap", t)
              t = t.replace(".asImageBitmap()", "")
              t = t.replace("Bitmap.createBitmap(", "android.graphics.Bitmap.createBitmap(")
              if t != orig:
                  f.write_text(t)
                  print("patched", f)
          PYEOF
      - name: Fix nested comment in ImageUtils KDoc
        run: |
          P=brinto-khata-android
          F="$P/app/src/main/java/com/brinto/khata/util/ImageUtils.kt"
          echo "--- ImageUtils.kt before ---"
          cat "$F"
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("brinto-khata-android/app/src/main/java/com/brinto/khata/util/ImageUtils.kt")
          t = p.read_text()
          # Kotlin block comments nest: the KDoc mentions image slash star, and
          # that opener starts a nested comment that the KDoc close never ends,
          # so the rest of the file (object ImageUtils) is swallowed.
          if '"image/*"' in t:
              t = t.replace('"image/*"', '"image"')
              p.write_text(t)
              print("removed nested comment opener from ImageUtils KDoc")
          else:
              print("no nested opener found in ImageUtils.kt")
          PYEOF
          echo "--- ImageUtils.kt after ---"
          cat "$F"
      - name: Add material-icons-extended
        run: |
          P=brinto-khata-android
          grep -n "material" "$P/app/build.gradle.kts" || true
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("brinto-khata-android/app/build.gradle.kts")
          t = p.read_text()
          if "material-icons-extended" not in t:
              # The project declares material3 with a version, so anchor on the
              # dependencies block instead of the material3 line. The Compose BOM
              # (compose-bom:2024.09.00) manages this artifact version.
              anchor = "dependencies {"
              i = t.find(anchor)
              if i < 0:
                  raise SystemExit("ERROR: dependencies block not found")
              line = '    implementation("androidx.compose.material:material-icons-extended")'
              t = t[: i + len(anchor)] + chr(10) + line + t[i + len(anchor):]
              p.write_text(t)
              print("added material-icons-extended")
          else:
              print("material-icons-extended already present")
          PYEOF
          grep -n "material" "$P/app/build.gradle.kts" || true
      - name: Set Gradle memory
        run: |
          P=brinto-khata-android
          echo "--- gradle.properties before ---"
          cat "$P/gradle.properties" || echo "(no gradle.properties)"
          touch "$P/gradle.properties"
          # Keep the project gradle.properties (it enables AndroidX, etc.); only replace the memory lines and make sure AndroidX is enabled.
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.daemon=/d; /^org.gradle.parallel=/d; /^android.useAndroidX=/d' "$P/gradle.properties"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\nandroid.useAndroidX=true\n' >> "$P/gradle.properties"
          echo "--- gradle.properties after ---"
          cat "$P/gradle.properties"
      - name: Build debug APK
        run: |
          cd brinto-khata-android
          "$GRADLE_BIN" :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brinto-khata-debug-apk
          path: brinto-khata-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
