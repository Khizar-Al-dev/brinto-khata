name: Build Kheera APK

on:
  push:
    branches: [main]
    paths:
      - 'kheera-slice-game.zip'
      - '.github/workflows/build-kheera-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip game project
        run: |
          unzip -o kheera-slice-game.zip -d kheera-slice-game
          ls kheera-slice-game
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          GRADLE_BIN=$(echo /tmp/gradle-*/bin/gradle)
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version
      - name: Build debug APK
        run: |
          cd kheera-slice-game
          "$GRADLE_BIN" :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kheera-slice-debug-apk
          path: kheera-slice-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
